<html>
<body>

<h2>JavaScript if</h2>
<p>Display "Good day!" if the hour is less than 18:00:</p>
<p id="demo">Good Evening!</p>


<script>
if (new Date().getHours() > 19) 
{
  document.getElementById("demo").innerHTML = "Good day!";
}
else
{
  document.getElementById("demo").innerHTML = "Good night!";
}
</script>

</body>
</html>
