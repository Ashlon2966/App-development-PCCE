<html>
<body>

<h2>JavaScript For In</h2>
<p>The for of statement loops through the values of an iterable obj:</p>
<p id="demo"></p>

<script>
let langs = "JavaScript";

let txt = "";
for (let x in langs) 
{
    txt += x + "<br>";
}

document.getElementById("demo").innerHTML = txt;
</script>

</body>
</html>
