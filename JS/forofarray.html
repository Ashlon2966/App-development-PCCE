<html>
<body>

<h2>JavaScript For In</h2>
<p>The for in statement can loops over array values:</p>
<p id="demo"></p>

<script>
const cars = ["BMW", "Volvo", "Mini"];

let txt = "";
for (let x in cars) 
{
    txt += x + "<br>";
}

document.getElementById("demo").innerHTML = txt;
</script>

</body>
</html>
